<!--
  PS Office sidebar logo (source of truth): the PS TEXTILES logo.
  The letters are the PS TEXTILES logo of PS Textiles, S.A., redrawn as vector
  outlines from the company's logo image. The PS TEXTILES name and logo are
  PS Textiles' own marks and are not licensed under the Apache License 2.0.

  Black and grey only on purpose: the shell flips it for dark themes with a
  CSS invert filter, so it must not carry any colour (the grey fade of
  TEXTILES inverts to a light-grey fade).

  Copied verbatim to apps/shell/src/renderer/src/assets/genoffice-logo.svg by
    node tools/gen-brand-assets.mjs
  Keep the 1091x240 canvas: the sidebar sizes the logo by height.
-->
